# Build and test on every push and pull request; on a version tag also build the MSI and attach it
# (with its SHA-256) to the GitHub release. The crate is Windows-only (winit/Win32/OLE).
name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The repo has no .cargo/config.toml (it is per-machine); keep the output in the workspace.
  CARGO_TARGET_DIR: target

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked
      - run: cargo clippy --release --locked --all-targets -- -D warnings
      - run: cargo build --release --locked

  msi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # WiX 5 is pinned: newer major versions have different licence terms. build_msi.ps1 adds
      # the UI and Util extensions itself.
      - run: dotnet tool install --global wix --version 5.0.2
      - name: The tag must be the Cargo.toml version
        shell: pwsh
        run: |
          $v = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages | Where-Object name -eq 'kxs-watcher' | ForEach-Object version
          if ('${{ github.ref_name }}' -ne "v$v") { throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $v" }
      - name: Build the MSI
        shell: pwsh
        run: ./build_msi.ps1
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/KXS-Watcher/*.msi
            target/KXS-Watcher/*.msi.sha256
